name: Sugestão
description: Uma ideia para o AERES Bar
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como você imagina
      description: Onde aparece (barra, painel, menu) e como funciona.
