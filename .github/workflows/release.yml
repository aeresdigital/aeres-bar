name: Release

# Cada push na main que muda o app gera e publica uma versão: MAJOR.MINOR do arquivo VERSION mais
# o número do build (commits na main), por exemplo 1.0.23. Ela sai em dois lugares:
# - aqui, no repositório privado, com a tag no commit do código;
# - no repositório público só de releases (UPDATE_FEED_REPO), de onde as pessoas instalam e de onde
#   os apps instalados se atualizam, lendo o update.json assinado (Sources/AERESBarCore/Update).
#   O código-fonte não vai para lá.
#
# Segredos (Settings › Secrets and variables › Actions):
# - UPDATE_SIGNING_KEY: chave privada Ed25519 das atualizações (scripts/sign_update.swift);
# - RELEASES_TOKEN: token fine-grained com "Contents: Read and write" só no UPDATE_FEED_REPO.
# Sem eles, a versão sai só aqui e os apps instalados não a recebem.
# Opcionais, para assinar com Developer ID e notarizar: MACOS_CERTIFICATE,
# MACOS_CERTIFICATE_PASSWORD, NOTARY_KEY_ID, NOTARY_ISSUER_ID e NOTARY_KEY.
#
# Actions › Release › Run workflow roda de novo à mão. Com "Publicar" desligado, ou fora da main,
# só gera os arquivos e os guarda como artefato.

on:
  push:
    branches: [main]
    # Documentation, tests and repository settings do not change the app.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Tests/**"
      - "BuildTools/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - ".swift-format"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar (desligado: só gera os arquivos e os guarda como artefato)"
        type: boolean
        default: true

permissions:
  contents: write

# One at a time, never cancelled: a cancelled run could leave a version half published.
concurrency:
  group: release
  cancel-in-progress: false

env:
  UPDATE_FEED_REPO: aeresdigital/aeres-bar-releases

jobs:
  release:
    name: Gerar e publicar
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARY_KEY != '' }}
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
      HAS_FEED_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
      # Only main publishes: a branch's build number could overtake main's and reach people.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build number = commits on main; notes = commits since the last tag

      - name: Selecionar o Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versão
        run: |
          series="$(tr -d '[:space:]' < VERSION)"
          build="$(git rev-list --count HEAD)"
          {
            echo "BUILD_NUMBER=$build"
            echo "VERSION=$series.$build"
            echo "TAG=v$series.$build"
          } >> "$GITHUB_ENV"
          echo "## AERES Bar $series.$build" >> "$GITHUB_STEP_SUMMARY"

      - name: Notas
        run: |
          scripts/release_notes.sh > "$RUNNER_TEMP/notes.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/notes.md"

      - name: Testes
        run: swift test -Xswiftc -warnings-as-errors

      - name: Importar o certificado Developer ID
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/ci/import_certificate.sh

      - name: App universal e DMG
        run: |
          UNIVERSAL=1 scripts/build_app.sh
          scripts/make_dmg.sh

      - name: Notarizar
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          scripts/notarize.sh dist/AERES-Bar.dmg
          (cd dist && shasum -a 256 AERES-Bar.dmg > AERES-Bar.dmg.sha256)

      - name: Pacote de atualização assinado
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          scripts/make_update.sh "$RUNNER_TEMP/notes.md" "https://github.com/$UPDATE_FEED_REPO/releases/download/$TAG/AERES-Bar.zip"
          cp scripts/install_release.sh dist/install.sh

      - name: Texto da release
        run: scripts/ci/release_body.sh "$RUNNER_TEMP/notes.md" "$HAS_SIGNING" > "$RUNNER_TEMP/release.md"

      - name: Guardar os arquivos
        uses: actions/upload-artifact@v7
        with:
          name: AERES-Bar-${{ env.VERSION }}
          path: |
            dist/AERES-Bar.*
            dist/update.json
            dist/install.sh
          retention-days: 14
          if-no-files-found: error

      - name: Publicar no repositório privado
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: AERES Bar ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release.md
          files: dist/AERES-Bar.*
          fail_on_unmatched_files: true

      - name: Conferir a versão que as pessoas têm
        if: env.PUBLISH == 'true' && env.HAS_UPDATE_KEY == 'true' && env.HAS_FEED_TOKEN == 'true'
        run: |
          published="$(curl -fsSL "https://github.com/$UPDATE_FEED_REPO/releases/latest/download/update.json" 2>/dev/null | jq -r '.build // 0' 2>/dev/null || true)"
          if (( ${published:-0} > BUILD_NUMBER )); then
            echo "::warning::Já está publicado o build $published, mais novo que $BUILD_NUMBER: esta versão não vai para as pessoas."
            echo "FEED_AHEAD=true" >> "$GITHUB_ENV"
          fi

      - name: Publicar para as pessoas
        if: env.PUBLISH == 'true' && env.HAS_UPDATE_KEY == 'true' && env.HAS_FEED_TOKEN == 'true' && env.FEED_AHEAD != 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.UPDATE_FEED_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          target_commitish: main
          tag_name: ${{ env.TAG }}
          name: AERES Bar ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release.md
          make_latest: true
          files: |
            dist/AERES-Bar.dmg
            dist/AERES-Bar.dmg.sha256
            dist/AERES-Bar.zip
            dist/AERES-Bar.zip.sha256
            dist/update.json
            dist/install.sh
          fail_on_unmatched_files: true

      - name: Avisos
        if: env.HAS_UPDATE_KEY != 'true' || env.HAS_FEED_TOKEN != 'true' || env.PUBLISH != 'true'
        run: |
          if [[ "$HAS_UPDATE_KEY" != "true" || "$HAS_FEED_TOKEN" != "true" ]]; then
            echo "::warning::Sem UPDATE_SIGNING_KEY ou RELEASES_TOKEN: a versão $VERSION não vai para as pessoas nem chega aos apps instalados."
          fi
          if [[ "$PUBLISH" != "true" ]]; then
            echo "::notice::Nada publicado: os arquivos da $VERSION estão no artefato AERES-Bar-$VERSION."
          fi
